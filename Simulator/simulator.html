<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Home — Hardware Simulator</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #10131a;
    color: #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  .card {
    background: #1c2030;
    padding: 40px 56px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  h2 { margin-top: 0; }
  .status {
    font-size: 1.4rem;
    margin: 20px 0;
    font-weight: bold;
  }
  .status.on { color: #4ade80; }
  .status.off { color: #f87171; }
  .status.other { color: #fbbf24; }

  button {
    padding: 12px 28px;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #3b82f6;
    color: white;
  }
  button:hover { background: #2563eb; }
  .hint { margin-top: 24px; font-size: 0.8rem; color: #888; }
</style>
</head>
<body>

<div class="card">
  <h2>💡 Living Room Lamp (simulated hardware)</h2>
  <div id="status" class="status off">OFF</div>
  <button id="toggleBtn">Flip Physical Switch</button>
  <div class="hint">This page IS the simulated device. Toggling it here<br>
  updates the database directly — no app involved — exactly<br>
  like a real switch reporting its state.</div>
</div>

<!-- Firebase Web SDK (compat build — simplest for a single static HTML file) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
  // === REPLACE THIS with YOUR project's config ===
  // Firebase console -> Project settings -> scroll to "Your apps" -> Web app (</>)
  const firebaseConfig = {
    apiKey: "AIzaSyAJ6qYiGhPdqKzFBbAEU3tcsU7kBFfo8ec",
    authDomain: "smart-home-e2079.firebaseapp.com",
    databaseURL: "https://smart-home-e2079-default-rtdb.firebaseio.com/", 
    projectId: "smart-home-e2079",
    storageBucket: "smart-home-e2079.firebasestorage.app",
    messagingSenderId: "22826556075",
    appId: "1:22826556075:web:c69201b1d033de3cd835ee"
};


  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const stateRef = db.ref("switches/switch_01/state");

  const statusEl = document.getElementById("status");
  const btn = document.getElementById("toggleBtn");

  let currentState = "OFF";

  // LISTEN: reflect whatever the database says, whether the change came
  // from this page, the Android app, or (later) a Cloud Function.
  stateRef.on("value", (snapshot) => {
    currentState = snapshot.val() || "OFF";
    render(currentState);
  });

  function render(state) {
    statusEl.textContent = state;
    statusEl.className = "status " +
      (state === "ON" ? "on" : state === "OFF" ? "off" : "other");
  }

  // WRITE: simulate the physical switch flipping -> push straight to DB.
  btn.addEventListener("click", () => {
    const next = currentState === "ON" ? "OFF" : "ON";
    stateRef.set(next);
  });
</script>

</body>
</html>
